
name: Build ClickTap IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build ClickTap
        run: |
          xcodebuild \
            -project ClickTap.xcodeproj \
            -scheme ClickTap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClickTap.app Payload/
          zip -r ClickTap-IPA.zip Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClickTap-IPA
          path: ClickTap-IPA.zip
